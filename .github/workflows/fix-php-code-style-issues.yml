name: Fix PHP code style issues

on:
  push:
    branches: [main, '*.x']
    paths:
      - 'composer.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '**.php'
  pull_request:
    paths:
      - '.github/workflows/fix-php-code-style-issues.yml'
      - 'composer.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '**.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # The repo's own pinned Pint, not a prebuilt action image: the action's
      # image lost mbstring and crashed in Termwind on 2026-11-20.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Fix PHP code style issues
        run: vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Fix styling
