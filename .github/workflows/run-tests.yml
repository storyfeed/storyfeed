name: run-tests

on:
  push:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

# On main every commit keeps its own full run: several lanes push to main, and a
# shared group would cancel (or replace the queued run of) another lane's commit.
# Branches and pull requests still cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A job that exceeds this reports as `cancelled`, NOT `failure` — so a
    # timeout looks exactly like "something keeps cancelling my runs" and sends
    # you hunting for a canceller that does not exist. When a run reports
    # cancelled, compare its DURATION to this cap before looking anywhere else.
    # Windows has reached the five-minute cap after successful tests during
    # cleanup. Allow setup, the full suite and cleanup eight minutes there.
    # Real-engine cells build the schema once per worker and truncate between
    # tests (#112): each engine took about four minutes locally with four
    # workers, so 40 minutes is a hang guard. SQLite retains its five-minute cap.
    timeout-minutes: ${{ matrix.database != 'sqlite' && 40 || matrix.os == 'windows-latest' && 8 || 5 }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        runner: [serial]
        database: [sqlite]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          # One extra cell runs the suite under --parallel, so a test that
          # shares a file across workers (the testbench skeleton is shared)
          # goes red here instead of only on a laptop. Newest stack on the
          # fastest runner: the bug class is shared files, not OS or version.
          # It sets `runner`, an original key, so it is a 17th job rather
          # than being merged into its serial twin.
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            runner: parallel
            database: sqlite
          # `database` is an original key, so this is an extra job instead
          # of being merged into the matching SQLite cell. Each engine is
          # included only after its full local suite has passed.
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            runner: parallel
            database: mysql
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            runner: parallel
            database: postgres
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
            runner: parallel
            database: mariadb

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}${{ matrix.runner == 'parallel' && ' - parallel' || '' }} - ${{ matrix.database }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo${{ matrix.database == 'postgres' && ', pdo_pgsql' || matrix.database != 'sqlite' && ', pdo_mysql' || '' }}
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Start MySQL
        if: matrix.database == 'mysql'
        shell: bash
        run: |
          # Every test drops and recreates the schema, and MySQL 8 syncs each
          # DDL statement to disk. On the runner's disk that took the cell past
          # 40 minutes (#112); a data directory in memory removes the syncs.
          docker run -d --name storyfeed-db --tmpfs /var/lib/mysql -e MYSQL_ALLOW_EMPTY_PASSWORD=1 -e MYSQL_DATABASE=storyfeed_test -p 33306:3306 mysql:8
          # Init uses a temporary socket-only server; wait for the final TCP server.
          for attempt in {1..60}; do
            if docker exec storyfeed-db mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec storyfeed-db mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT VERSION()'
          printf '%s\n' 'STORYFEED_TEST_DB=mysql' 'STORYFEED_TEST_PORT=33306' 'STORYFEED_TEST_DATABASE=storyfeed_test' 'STORYFEED_TEST_USERNAME=root' 'STORYFEED_TEST_PASSWORD=' >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        if: matrix.database == 'postgres'
        shell: bash
        run: |
          docker run -d --name storyfeed-db -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=storyfeed_test -p 35432:5432 postgres:18
          # Init uses a temporary socket-only server; wait for the final TCP server.
          for attempt in {1..60}; do
            if docker exec storyfeed-db psql -h 127.0.0.1 -U postgres -d storyfeed_test -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec storyfeed-db psql -h 127.0.0.1 -U postgres -d storyfeed_test -c 'SELECT version()'
          printf '%s\n' 'STORYFEED_TEST_DB=pgsql' 'STORYFEED_TEST_PORT=35432' 'STORYFEED_TEST_DATABASE=storyfeed_test' 'STORYFEED_TEST_USERNAME=postgres' 'STORYFEED_TEST_PASSWORD=' >> "$GITHUB_ENV"

      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        shell: bash
        run: |
          docker run -d --name storyfeed-db -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 -e MARIADB_DATABASE=storyfeed_test -p 33306:3306 mariadb:12.3
          # Init uses a temporary socket-only server; wait for the final TCP server.
          for attempt in {1..60}; do
            if docker exec storyfeed-db mariadb --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec storyfeed-db mariadb --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT VERSION()'
          printf '%s\n' 'STORYFEED_TEST_DB=mariadb' 'STORYFEED_TEST_PORT=33306' 'STORYFEED_TEST_DATABASE=storyfeed_test' 'STORYFEED_TEST_USERNAME=root' 'STORYFEED_TEST_PASSWORD=' >> "$GITHUB_ENV"

      - name: Execute tests
        run: vendor/bin/pest --ci ${{ matrix.runner == 'parallel' && '--parallel' || '' }} ${{ matrix.database != 'sqlite' && '--processes=4' || '' }}

      - name: Guard burst rebuild at 100K activities on MariaDB
        if: matrix.database == 'mariadb'
        env:
          STORYFEED_REBUILD_BENCH: '1'
          STORYFEED_REBUILD_REPORT: build/burst-rebuild-100k.json
        run: |
          mkdir -p build
          php -d memory_limit=512M vendor/bin/pest tests/Performance/BurstRebuildPerformanceTest.php --ci

      - name: Upload burst rebuild performance report
        if: always() && matrix.database == 'mariadb'
        uses: actions/upload-artifact@v7
        with:
          name: burst-rebuild-100k-mariadb
          path: build/burst-rebuild-100k.json

      - name: Guard read performance at 100K activities
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.runner == 'serial' && matrix.database == 'sqlite'
        env:
          STORYFEED_READ_BENCH: '1'
          STORYFEED_READ_REPORT: build/read-path-100k.json
        run: |
          mkdir -p build
          vendor/bin/pest tests/Performance/ReadPathPerformanceTest.php --ci

      - name: Upload read performance report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.runner == 'serial' && matrix.database == 'sqlite'
        uses: actions/upload-artifact@v7
        with:
          name: read-path-100k
          path: build/read-path-100k.json
