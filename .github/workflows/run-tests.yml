name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-only experiment on probe/sqlsrv; never merge this workflow into main.
jobs:
  test:
    name: SQL Server probe - PHP 8.5 - Laravel 13 - parallel 4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, sqlsrv, pdo_sqlsrv
          coverage: none

      - name: Verify SQL Server drivers
        run: |
          odbcinst -q -d
          php --ri sqlsrv
          php --ri pdo_sqlsrv

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction
          composer show -D

      - name: Start SQL Server over TCP and create test database
        shell: bash
        env:
          MSSQL_SA_PASSWORD: 'StoryfeedProbe_2026!Only'
        run: |
          docker run -d --name storyfeed-db -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..90}; do
            if docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" storyfeed-db /opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" storyfeed-db /opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -C -b -Q 'SELECT @@VERSION; CREATE DATABASE storyfeed_test'
          printf '%s\n' 'STORYFEED_TEST_DB=sqlsrv' 'STORYFEED_TEST_PORT=1433' 'STORYFEED_TEST_DATABASE=storyfeed_test' 'STORYFEED_TEST_USERNAME=sa' "STORYFEED_TEST_PASSWORD=$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"

      - name: Execute tests
        run: vendor/bin/pest --ci --parallel --processes=4 --log-junit=sqlsrv-junit.xml

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlsrv-probe-results
          path: sqlsrv-junit.xml
          if-no-files-found: warn

      - name: SQL Server logs on failure
        if: failure()
        run: docker logs storyfeed-db
