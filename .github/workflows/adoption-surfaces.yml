name: adoption-surfaces

on:
  push:
    branches: [main, '*.x']
    paths:
      - '.github/workflows/adoption-surfaces.yml'
      - 'resources/adoption/**'
      - 'tests/AdoptionSurfacesTest.php'
      - 'tests/Fixtures/adoption/**'
      - 'tools/standards/**'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '.github/workflows/adoption-surfaces.yml'
      - 'resources/adoption/**'
      - 'tests/AdoptionSurfacesTest.php'
      - 'tests/Fixtures/adoption/**'
      - 'tools/standards/**'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adoption-fixtures:
    name: Adoption fixtures (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install package test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install the isolated standards CLI
        run: composer install -d tools/standards --no-interaction --no-progress --prefer-dist

      - name: Check all five adoption fixtures through the standards CLI
        env:
          STORYFEED_ADOPTION_CHECKER: tools/standards/vendor/bin/standards
        run: vendor/bin/pest tests/AdoptionSurfacesTest.php --ci
